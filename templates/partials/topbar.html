<!-- Topbar -->
      <header class="tb">
        <!-- Tombol hamburger — tampil hanya di mobile -->
        <button class="btn-hamburger" onclick="openSidebar()" aria-label="Buka menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="tb-l">
          Dashboard / <span id="tb-page">Monitoring Absensi</span>
        </div>
        <div class="tb-r" id="tb-btns">
          <a id="btn-excel" class="btn btn-ghost" href="#" style="display: none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" /></svg>Export Excel
          </a>
          <a id="btn-pdf" class="btn btn-green" href="#" style="display: none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" /></svg>Export PDF
          </a>
          <div style="width:1px;height:22px;background:var(--bor);margin:0 1px"></div>
          <a href="/logout" class="btn btn-ghost" style="color:var(--dan);border-color:transparent">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" /></svg>Logout
          </a>
        </div>
      </header>
