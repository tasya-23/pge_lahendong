<!-- ══ MODAL GANTI PASSWORD ══════════════════════════════ -->
<div class="modal-bg" id="modal-ganti-pw">
  <div class="modal" style="max-width:420px">
    <div class="mh">
      <div>
        <h2>🔑 Ganti Password</h2>
        <p>Masukkan password lama dan password baru kamu</p>
      </div>
      <button class="mc-btn" onclick="closeGantiPassword()">✕</button>
    </div>
    <div style="padding:20px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;flex-direction:column;gap:5px">
        <label style="font-size:12.5px;font-weight:700;color:var(--mut)">Password Lama</label>
        <div style="position:relative">
          <input type="password" id="pw-lama" placeholder="Masukkan password lama"
            style="width:100%;padding:9px 38px 9px 12px;border:1.5px solid var(--bor);
                   border-radius:9px;font-size:13px;font-family:inherit;color:var(--tex);
                   background:var(--wh);outline:none;box-sizing:border-box;transition:border-color 0.18s"
            onfocus="this.style.borderColor='var(--g)'" onblur="this.style.borderColor='var(--bor)'"/>
          <button type="button" onclick="togglePw('pw-lama',this)"
            style="position:absolute;right:8px;top:50%;transform:translateY(-50%);
                   background:none;border:none;cursor:pointer;font-size:15px;color:var(--mut);padding:2px">👁</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <label style="font-size:12.5px;font-weight:700;color:var(--mut)">Password Baru</label>
        <div style="position:relative">
          <input type="password" id="pw-baru" placeholder="Minimal 6 karakter"
            style="width:100%;padding:9px 38px 9px 12px;border:1.5px solid var(--bor);
                   border-radius:9px;font-size:13px;font-family:inherit;color:var(--tex);
                   background:var(--wh);outline:none;box-sizing:border-box;transition:border-color 0.18s"
            onfocus="this.style.borderColor='var(--g)'" onblur="this.style.borderColor='var(--bor)'"
            oninput="checkStrength(this.value)"/>
          <button type="button" onclick="togglePw('pw-baru',this)"
            style="position:absolute;right:8px;top:50%;transform:translateY(-50%);
                   background:none;border:none;cursor:pointer;font-size:15px;color:var(--mut);padding:2px">👁</button>
        </div>
        <div style="display:flex;gap:4px;margin-top:2px">
          <div style="height:3px;flex:1;border-radius:2px;background:var(--bor)" id="psb-1"></div>
          <div style="height:3px;flex:1;border-radius:2px;background:var(--bor)" id="psb-2"></div>
          <div style="height:3px;flex:1;border-radius:2px;background:var(--bor)" id="psb-3"></div>
          <div style="height:3px;flex:1;border-radius:2px;background:var(--bor)" id="psb-4"></div>
        </div>
        <div style="font-size:11px;color:var(--mut)" id="pw-strength-lbl"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <label style="font-size:12.5px;font-weight:700;color:var(--mut)">Konfirmasi Password Baru</label>
        <div style="position:relative">
          <input type="password" id="pw-konfirm" placeholder="Ulangi password baru"
            style="width:100%;padding:9px 38px 9px 12px;border:1.5px solid var(--bor);
                   border-radius:9px;font-size:13px;font-family:inherit;color:var(--tex);
                   background:var(--wh);outline:none;box-sizing:border-box;transition:border-color 0.18s"
            onfocus="this.style.borderColor='var(--g)'" onblur="this.style.borderColor='var(--bor)'"/>
          <button type="button" onclick="togglePw('pw-konfirm',this)"
            style="position:absolute;right:8px;top:50%;transform:translateY(-50%);
                   background:none;border:none;cursor:pointer;font-size:15px;color:var(--mut);padding:2px">👁</button>
        </div>
      </div>
      <div id="pw-error"
        style="display:none;padding:9px 12px;background:#fee2e2;border-radius:8px;
               font-size:12.5px;color:#b91c1c;font-weight:600"></div>
      <div style="display:flex;gap:10px;margin-top:4px">
        <button onclick="closeGantiPassword()" class="btn btn-ghost" style="flex:1">Batal</button>
        <button onclick="submitGantiPassword()" class="btn btn-green" id="btn-submit-pw" style="flex:2">Simpan Password</button>
      </div>
    </div>
  </div>
</div>
