<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Absensi — PGE Lahendong</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/css/main.css" />
  </head>
  <body>
    <!-- Loading overlay -->
    <div class="lov" id="lov">
      <div class="spinner"></div>
      <span style="font-size: 13px; font-weight: 600; color: var(--mut)">Memuat data...</span>
    </div>
    <div class="toast" id="toast"></div>

    <!-- Overlay gelap saat sidebar terbuka di mobile -->
    <div class="sb-overlay" id="sb-overlay" onclick="closeSidebar()"></div>

    {% include "partials/sidebar.html" %}

    <div class="main">
      {% include "partials/topbar.html" %}

      {% block content %}{% endblock %}
    </div>

    {% include "partials/modal.html" %}



    <!-- JavaScript — urutan penting -->
    <script src="/static/js/core.js"></script>
    <script src="/static/js/upload.js"></script>
    <script src="/static/js/filter.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script src="/static/js/rekap.js"></script>
    <script src="/static/js/ranking.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/ganti_password.js"></script>
    <script src="/static/js/init.js"></script>
  <script>
    // ── Mobile sidebar toggle ──────────────────────────
    function openSidebar() {
      const sb = document.getElementById("sb");
      const ov = document.getElementById("sb-overlay");
      if (!sb || !ov) return;
      sb.classList.add("open");
      ov.classList.add("show");
      document.body.style.overflow = "hidden";
    }
    function closeSidebar() {
      const sb = document.getElementById("sb");
      const ov = document.getElementById("sb-overlay");
      if (!sb || !ov) return;
      sb.classList.remove("open");
      ov.classList.remove("show");
      document.body.style.overflow = "";
    }
    // Tutup sidebar saat klik menu di mobile
    document.querySelectorAll(".ni").forEach(btn => {
      btn.addEventListener("click", () => {
        if (window.innerWidth <= 900) closeSidebar();
      });
    });

    // ── Sync bottom nav active state ──────────────────
    const _origSwitchPage = typeof switchPage === "function" ? switchPage : null;
    // Override switchPage untuk sync bottom nav
    // (dipanggil setelah core.js load via DOMContentLoaded)
    document.addEventListener("DOMContentLoaded", () => {
      const origSwitch = window.switchPage;
      if (origSwitch) {
        window.switchPage = function(page) {
          origSwitch(page);
          if (window.innerWidth <= 900) closeSidebar();
        };
      }
    });

    function syncBottomNav(page) {
      // Bottom nav sudah dihapus — fungsi ini dikosongkan agar tidak error
    }

    // ── Swipe gesture untuk tutup sidebar ─────────────
    let touchStartX = 0;
    document.addEventListener("touchstart", e => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });
    document.addEventListener("touchend", e => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (diff > 60) closeSidebar(); // swipe kiri → tutup
      if (diff < -60 && touchStartX < 30) openSidebar(); // swipe kanan dari tepi → buka
    }, { passive: true });
  </script>
  </body>
</html>
